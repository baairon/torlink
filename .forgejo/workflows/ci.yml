name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }} on Linux
    runs-on: docker
    container:
      image: "docker.io/library/node:${{ matrix.node }}-bookworm"
    strategy:
      fail-fast: false
      matrix:
        node: [22, "24.22.0"]

    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6

      # Install scripts exercise the shipped WebRTC fallback.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Build the same output that npm publish would build.
      - run: npm run build
