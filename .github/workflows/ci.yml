name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should never hide the result on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    steps:
      # Actions are pinned to commit SHAs, not tags: a tag is a mutable pointer
      # its owner can repoint at any commit, so `@v7` is an open invitation to
      # run code nobody here reviewed. The trailing comment is the human-readable
      # version, and Dependabot rewrites both halves together on an update.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Install scripts stay enabled on purpose: the postinstall WebRTC
      # fallback is itself a shipped code path, and a package-manager change
      # to how install scripts run is what broke installs in v1.4.1.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Builds what `npm publish` would build, so a broken publish path is
      # caught here rather than at release time.
      - run: npm run build
